# CI (ficha do M00). Sem remoto configurado, o equivalente obrigatório antes de cada revisão é
# `./pnpm verificar:tudo && ./pnpm seguranca:verificar`, com a saída anexada às evidências.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    env:
      CI: 'true'
      NX_LOAD_DOT_ENV_FILES: 'false'
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
      # O runner não tem MariaDB: os .int.spec que abrem o banco próprio se declaram pulados (SGH_NUCLEO_SEM_BANCO).
      # Eles rodam na VM contra um cliente de teste (tools/db/criar_cliente.py), fora da esteira do GitHub.
      SGH_NUCLEO_SEM_BANCO: '1'
      # Os testes HTTP que pedem PDF/A (RPA do repasse, PGTS e PMOC da manutenção, lista de presença) precisam do
      # conversor no ar, como na VM; sem ele a API responde 503 "Gerador de PDF indisponível".
      GOTENBERG_URL: http://127.0.0.1:3318
    services:
      gotenberg:
        image: gotenberg/gotenberg:8.28.0
        ports:
          - 127.0.0.1:3318:3000
      # O E2E sobe a API com a sessão no Valkey e a fila de e-mail no Mailpit (apps/web/playwright.config.ts: as
      # mesmas portas de loopback da VM).
      valkey:
        image: valkey/valkey:9.0.3-alpine
        ports:
          - 127.0.0.1:63718:6379
      mailpit:
        image: axllent/mailpit:v1.30.0
        ports:
          - 127.0.0.1:1325:1025
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Instalar (lockfile congelado)
        run: ./pnpm install --frozen-lockfile
      # Num push para main, `nx affected` contra origin/main não acharia nada: o CI roda tudo
      # (lint, tipos, testes e build de todos os projetos, prettier, segredos e resumo dos PENDENTE).
      - name: Verificar tudo (pnpm verificar:tudo)
        run: ./pnpm verificar:tudo
      - name: Prova das fronteiras (importação proibida faz o lint falhar)
        run: ./pnpm fronteiras:provar
      # A API e o worker não sobem se a trava de saídas recusar o ambiente: o passo próprio mostra qual
      # chave foi recusada (só o nome e o host, nunca valores), antes de o E2E esperar o servidor.
      # O executor do GitHub injeta GITHUB_API_URL, GITHUB_GRAPHQL_URL e GITHUB_SERVER_URL (metadados do runner, não
      # integração do produto): a trava as recusa como destino externo. Saem só do processo que sobe o sistema; a
      # trava continua igual.
      - name: Trava de saídas (ambiente:verificar)
        run: env -u GITHUB_API_URL -u GITHUB_GRAPHQL_URL -u GITHUB_SERVER_URL ./pnpm ambiente:verificar
      # Sem .env no runner: a API e o worker só sobem com o AMBIENTE declarado (ci: neutralizado, sem banco).
      # Decisão 59 do dono: o marco (@M00) e o pacote curto das jornadas principais (@jornada: entrada, agenda,
      # prontuário, conta e lote TISS), mesma linha do tools/obra/ci-sim.sh.
      - name: E2E do marco e das jornadas (Chrome do runner, channel chrome)
        env:
          AMBIENTE: ci
        run: env -u GITHUB_API_URL -u GITHUB_GRAPHQL_URL -u GITHUB_SERVER_URL ./pnpm e2e -- --grep "@M00|@jornada"
      - name: Segurança (gitleaks, Semgrep, OSV, Trivy, SBOM)
        run: ./pnpm seguranca:verificar
