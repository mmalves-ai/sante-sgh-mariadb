# CI (ficha do M00). Sem remoto configurado, o equivalente obrigatório antes de cada revisão é
# `./pnpm verificar:tudo && ./pnpm seguranca:verificar`, com a saída anexada às evidências.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    env:
      CI: 'true'
      NX_LOAD_DOT_ENV_FILES: 'false'
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Instalar (lockfile congelado)
        run: ./pnpm install --frozen-lockfile
      # Num push para main, `nx affected` contra origin/main não acharia nada: o CI roda tudo
      # (lint, tipos, testes e build de todos os projetos, prettier, segredos e resumo dos PENDENTE).
      - name: Verificar tudo (pnpm verificar:tudo)
        run: ./pnpm verificar:tudo
      - name: Prova das fronteiras (importação proibida faz o lint falhar)
        run: ./pnpm fronteiras:provar
      # A API e o worker não sobem se a trava de saídas recusar o ambiente: o passo próprio mostra qual
      # chave foi recusada (só o nome e o host, nunca valores), antes de o E2E esperar o servidor.
      - name: Trava de saídas (ambiente:verificar)
        run: ./pnpm ambiente:verificar
      - name: E2E do marco (Chrome do runner, channel chrome)
        run: ./pnpm e2e -- --grep @M00
      - name: Segurança (gitleaks, Semgrep, OSV, Trivy, SBOM)
        run: ./pnpm seguranca:verificar
