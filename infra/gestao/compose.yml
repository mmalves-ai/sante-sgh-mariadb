# Gestão do MariaDB pelo browser (pedido do dono, 2026-11-21). O MariaDB continua só no loopback do host;
# o Adminer fala com ele pela rede interna do Docker, e só o Caddy (HTTPS) é publicado na rede local.
name: sgh-gestao
services:
  adminer:
    image: adminer:4.8.1
    container_name: sgh-gestao-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: sante-sgh-mariadb
      ADMINER_DESIGN: pepa-linha
    networks: [banco, borda]
  caddy:
    image: caddy:2.8.4
    container_name: sgh-gestao-caddy
    restart: unless-stopped
    # Só o usuário e o resumo bcrypt da tela do Mailpit (nunca a senha). Subir com o .env da raiz:
    #   docker compose --env-file ../../.env up -d --no-deps caddy
    # Sem as variáveis, a subida falha (a tela não abre sem senha).
    environment:
      MAILPIT_GESTAO_USUARIO: ${MAILPIT_GESTAO_USUARIO:?defina MAILPIT_GESTAO_USUARIO no .env da raiz}
      MAILPIT_GESTAO_HASH: ${MAILPIT_GESTAO_HASH:?defina MAILPIT_GESTAO_HASH no .env da raiz}
    ports:
      - '0.0.0.0:5320:5320'
      - '0.0.0.0:5325:5325'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../certs:/certs:ro
      - caddy-dados:/data
    # captura: a rede do Mailpit (sgh-mailpit), só para a tela de leitura dos e-mails do desenvolvimento
    networks: [borda, captura]
networks:
  banco:
    external: true
    name: sante-sgh-oracle_default
  borda: {}
  captura:
    external: true
    name: sgh-rede
volumes:
  caddy-dados: {}
