# Sessão de trace do Firebird 3.0 para a captura de assinatura (M03; cap-10 §10.3, cenário controlado).
# Modelo: `pnpm assinatura:capturar -- --trace` troca {{BANCO}} pelo arquivo do banco da cópia (só o nome
# do arquivo, como o Firebird espera no filtro) e {{CONEXAO}} pela conexão do cenário (CURRENT_CONNECTION; 0 =
# todas, no cenário controlado do M36, executado no outro sistema): só aquela conexão é rastreada. A saída é lida EM MEMÓRIA e reduzida a nomes de tabela, comandos, triggers
# e contagens (tools/assinatura/src/trace.ts); o texto bruto nunca é gravado. SQL cortado em 300 caracteres
# (basta para o verbo e a tabela) e argumentos reduzidos ao mínimo.
database = %[\\/]{{BANCO}}
{
	enabled = true
	connection_id = {{CONEXAO}}
	log_connections = false
	log_transactions = false
	log_statement_prepare = false
	log_statement_free = false
	log_statement_start = false
	log_statement_finish = true
	log_procedure_start = false
	log_procedure_finish = true
	log_trigger_start = false
	log_trigger_finish = true
	log_context = false
	log_errors = true
	print_plan = false
	print_perf = true
	time_threshold = 0
	max_sql_length = 300
	max_arg_length = 1
	max_arg_count = 1
}
